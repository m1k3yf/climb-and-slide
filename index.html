<style>
  :root {
    --bg: #f4efe6;
    --bg-2: #eae3d4;
    --ink: #1a1f2e;
    --ink-2: #384056;
    --mute: #6b6555;
    --mute-soft: #8a8578;
    --line: #1a1f2e;
    --board-bg: #1a1f2e;
    --board-light: #f7f1e4;
    --board-dark: #2a3144;
    --accent: #e8583e;
    --accent-2: #2a8a5f;
    --accent-3: #e8b23e;
    --accent-4: #5b6cff;
    --p1: #e8583e;
    --p2: #2a8a5f;
    --p3: #e8b23e;
    --p4: #5b6cff;
    --p5: #a855a0;
    --robot: #2a3144;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Geist', -apple-system, system-ui, sans-serif;
  }
  body {
    background:
      radial-gradient(ellipse at 20% 0%, #fdf7ea 0%, transparent 50%),
      radial-gradient(ellipse at 100% 100%, #e8dfc8 0%, transparent 55%),
      var(--bg);
  }
  #root { height: 100%; }
  button { font-family: inherit; border: none; cursor: pointer; background: none; color: inherit; }
  .mono { font-family: 'Geist Mono', monospace; }
  .serif { font-family: 'Bricolage Grotesque', serif; font-optical-sizing: auto; letter-spacing: -0.02em; }

  /* Visible focus ring everywhere — without this, keyboard users see nothing.
     Uses :focus-visible so mouse/touch don't get the ring on click. */
  :focus { outline: none; }
  :focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }
  button:focus-visible, a:focus-visible, [role="button"]:focus-visible,
  input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }

  /* Screen-reader-only utility — shows content to assistive tech, hides it visually. */
  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }

  /* Respect users who request less motion (WCAG 2.3.3). Disable showy
     animations but keep small functional transitions so feedback is preserved. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 120ms !important;
      scroll-behavior: auto !important;
    }
    .confetti-piece, .portal-spin, .spiral-spin, .pulse-glow,
    .dice3d .d3-cube, .token.portaling { animation: none !important; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>

  <!-- Compiled game bundle (produced by build.sh from game.jsx). Loaded with defer
       so it parses after the document is ready but executes before DOMContentLoaded. -->
  <script src="game.js" defer></script>
